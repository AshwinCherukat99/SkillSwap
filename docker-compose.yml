services:
  postgres:
    image: postgres:17
    container_name: skillswap-postgres
    environment:
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: 
      - ./backend/.env
    container_name: skillswap-backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - postgres
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - ./frontend/.env
    container_name: skillswap_frontend
    command: npm run dev -- --host 0.0.0.0
    volumes: 
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports: 
      - "5173:5173"
    depends_on:
      - backend
  redis:
    image: redis:7
    container_name: skillswap_redis
    ports:
      - "6379:6379"
  celery:
    build: './backend'
    command: 'celery -A config worker --loglevel=info'
    volumes: 
      - './backend:/app'
    depends_on:
      - redis
      - postgres

volumes:
  postgres_data: