stages:
  - test
  - build

frontend-lint:
  stage: test
  image: node:22
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run lint

frontend-build:
  stage: build
  image: node:22
  cache:
    key:
      files: 
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week

backend_check:
  stage: test
  image: python:3.13
  services: 
    - name: postgres:17
      alias: postgres
    - name: redis:7
      alias: redis
  variables:
    POSTGRES_DB: skillswap_ci
    POSTGRES_USER: skillswap_ci
    POSTGRES_PASSWORD: ci_only_password

    DB_NAME: skillswap_ci
    DB_USER: skillswap_ci
    DB_PASSWORD: ci_only_password
    DB_HOST: postgres
    DB_PORT: "5432"

    # Dummy application settings for CI
    SECRET_KEY: "ci-only-dummy-secret-key-not-for-production"
    DEBUG: "False"
    ALLOWED_HOSTS: "localhost,127.0.0.1"

    # Email placeholders
    EMAIL_HOST: "localhost"
    EMAIL_PORT: "1025"
    EMAIL_HOST_USER: "ci@example.com"
    EMAIL_HOST_PASSWORD: "ci-only-password"
    EMAIL_USE_TLS: "False"
    DEFAULT_FROM_EMAIL: "ci@example.com"

    # OAuth placeholder
    GOOGLE_CLIENT_ID: "ci-placeholder.apps.googleusercontent.com"

    # Service URLs
    REDIS_URL: "redis://redis:6379/0"
    CELERY_BROKER_URL: "redis://redis:6379/0"
    CELERY_RESULT_BACKEND: "redis://redis:6379/0"

    # Non-secret local origins for CI
    CORS_ALLOWED_ORIGINS: "http://localhost:5173"
    CSRF_TRUSTED_ORIGINS: "http://localhost:5173"

    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key: "python pip-cache"
    paths: 
      - .cache/pip/
  script:
    - python --version
    - python -m pip install --upgrade pip
    - python -m pip install -r backend/requirements.txt
    - cd backend
    - python manage.py check